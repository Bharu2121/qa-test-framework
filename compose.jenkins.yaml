services:
  jenkins:
    build:
      context: ./jenkins-local
    container_name: jenkins-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    group_add:
      - "0"
      - "${DOCKER_GID:-0}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home: